plugins {
    id 'java'
}

group = 'net.runelite.client.plugins'
version = '1.0.0'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://repo.runelite.net'
    }
}

def runeLiteVersion = '1.13.1'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:runelite-api:${runeLiteVersion}"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
    }
}

tasks.register('run', JavaExec) {
    group = 'Execution'
    description = 'Launches RuneLite with the XP Alarm plugin loaded for local testing'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.runelite.client.plugins.xpalarm.XpAlarmPluginTest'
    enableAssertions = true
}
